# Yeda Vehicle Variant Agent v3 — Streamlit Secrets Template
#
# Place this file as .streamlit/secrets.toml for local Streamlit development.
#
# The app supports TWO formats:
#   1. Flat keys (legacy, env-compatible)
#   2. Sectioned keys (recommended for Streamlit Cloud)
#
# Both formats work simultaneously. Flat keys take priority over sectioned.

# ─────────────────────────────────────────────────────
# FORMAT 1: Flat keys (also usable as env variables)
# ─────────────────────────────────────────────────────
# GEMINI_API_KEY = "your-gemini-api-key"
# GEMINI_MODEL_FAST = "gemini-3.1-pro-preview"
# GEMINI_MODEL_STRONG = "gemini-3.1-pro-preview"
# GITHUB_TOKEN = "ghp_your-github-token"
# GITHUB_REPO = "giladscore494/yeda-vehicle-variant-agent-v3"
# GITHUB_BRANCH = "validation-v2-budgeted-dual-il-trims"
# CANONICAL_RESUME_PATH = "data/canonical/resume_package_canonical.json"
# CANONICAL_BACKUP_PATH = "data/canonical/resume_package_backup_previous.json"
# RUNTIME_STATE_PATH = "data/runtime/current_run.json"

# ─────────────────────────────────────────────────────
# FORMAT 2: Sectioned keys (recommended for Streamlit Cloud)
# ─────────────────────────────────────────────────────

[github]
token = "ghp_your-github-token"
repo_full_name = "giladscore494/yeda-vehicle-variant-agent-v3"
target_branch = "validation-v2-budgeted-dual-il-trims"
base_branch = "main"

[openai]
api_key = "sk-your-openai-key"
validator_model_id = "gpt-5.4"
web_search_enabled = true

[google]
api_key = "your-gemini-api-key"
gemini_validator_model_id = "gemini-3.1-pro"
grounding_enabled = true

[validation]
mode = "targeted-dual-validation"
input_file = "resume_package_canonical.json"
output_dir = "data/validated_runs"
output_file = "data/validated_runs/resume_package_canonical_validated_v2.json"
target_branch = "validation-v2-budgeted-dual-il-trims"
use_group_level_validation = true
enable_repo_write = true
enable_dry_run = false
